; Gemeinsame mypy-Grundlage für Standout-Projekte.
;
; ACHTUNG: mypy kennt keine Konfigurationsvererbung — es gibt kein `extend`
; und kein `include`. Diese Datei wird deshalb KOPIERT, nicht eingebunden.
; Aus demselben Grund prüft `quality audit` die Einbindung hier nicht: eine
; Kopie lässt sich nicht von einer eigenen Konfiguration unterscheiden. Bei
; Pint ist es dieselbe Lage und aus demselben Grund.
;
; Kopieren nach `mypy.ini` in der Komponente und die Pfade anpassen.
;
; `--strict` steht bewusst NICHT hier: die Option kommt aus dem Profil in
; quality.yml und wird vom Runner übergeben. Dasselbe Projekt soll unter
; beiden Profilen laufen können, ohne dass jemand diese Datei tauscht.

[mypy]
python_version = 3.11

; Fremdcode nie mitprüfen. Ohne diese Zeile analysiert `mypy .` das gesamte
; venv mit — der Lauf dauert dann Minuten und meldet Fehler in Paketen, an
; denen niemand hier etwas ändern kann.
exclude = (^|/)(\.venv|venv|node_modules|build|dist)/

; Ein Paket ohne Typen ist eine Tatsache, kein Fehler des Projekts. Die
; Meldung dazu gehört einmal an den Anfang und nicht in jede Datei.
ignore_missing_imports = True

; Der erste Schritt, der wirklich etwas findet, und der einzige, den auch
; untypisierter Bestandscode besteht: Funktionen ohne Annotation werden nicht
; still übersprungen.
check_untyped_defs = True

; Tests bleiben weicher: Fixtures und Monkeypatching erzeugen dort Meldungen,
; die über den Produktivcode nichts aussagen.
;
; disallow_untyped_defs muss hier ausdrücklich zurückgenommen werden. Unter
; `--strict` setzt mypy es GLOBAL, und ein Modul-Abschnitt überschreibt nur,
; was er selbst nennt — sonst verlangt das Gate von jedem `def test_x():` eine
; Rückgabeannotation. Beim ersten Probelauf war das der einzige Befund.
; Tests bleiben weicher: Fixtures und Monkeypatching erzeugen dort Meldungen,
; die über den Produktivcode nichts aussagen.
;
; disallow_untyped_defs muss ausdrücklich zurückgenommen werden. Unter
; `--strict` setzt mypy es GLOBAL, und ein Modul-Abschnitt überschreibt nur,
; was er selbst nennt — sonst verlangt das Gate von jedem `def test_x():` eine
; Rückgabeannotation.
;
; GRENZE, am 20.08.2026 gemessen: dieser Abschnitt greift nur, wenn `tests/`
; ein Paket ist. Ohne `__init__.py` darin sieht mypy die Datei als Top-Level-
; Modul `test_cli`, und kein Muster passt mehr — mypy erlaubt Wildcards nur
; als ganze Namenskomponente, `[mypy-test_*]` lehnt es mit einer Warnung ab.
; Wer Tests ohne Paket führt und den Unterschied braucht, legt ein leeres
; `tests/__init__.py` an.
[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
