# Quality-Gate für ein reines JS/TS-Projekt (Muster: resplan, Next.js mit pnpm).
# Nach .github/workflows/quality.yml im Projekt kopieren.

name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Nur Lesen. `pull-requests: write` stand hier für die PR-Kommentare von
    # gitleaks-action — die Action ist raus, das Recht damit auch.
    permissions:
      contents: read
      # Für den Tamper-Check im Push-Lauf: zu welchem PR gehört ein Commit?
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # der Tamper-Check braucht die Vorgeschichte

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bei einem Pull Request steht der Zweig nur für seinen eigenen Diff ein:
      # eine Formatierung, die der Zielbranch längst behoben hat, blockiert ihn
      # nicht mehr. Sichtbar bleibt sie als Hinweis. Beim Push auf den
      # Standardbranch bewusst ohne --base: dort gilt die ganze Fläche, sonst
      # dürfte main unbemerkt auseinanderlaufen.
      - name: Qualitätsprüfungen
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec quality full --base "$BASE"
          else
            pnpm exec quality full
          fi

      # Läuft auch beim Push auf den Standardbranch: `cc --abschliessen` merged
      # lokal und pusht die Basis — ohne diesen Zweig sähe der Check den
      # Normalfall nie. Er blockiert den Push nicht, der ist dann schon
      # passiert; er macht ihn sichtbar und färbt main rot.
      # `always()`, damit ein Lauf in einer Runde alles meldet statt in zweien.
      #
      # Das Werkzeug kommt aus dem Stand der Basis, nicht aus dem PR. Sonst
      # tauscht ein PR mit dem Lockfile die quality-Version aus, die ihn selbst
      # prüft. Die Version steht im Lockfile der Basis. quality hat keine
      # Laufzeit-Abhängigkeiten, ein Klon genügt. Findet der Schritt keine
      # Version, bricht er ab: ein Rückfall auf den PR hebelte den Schutz aus.
      - name: Tamper-Check
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          # Pull Request: gegen den Zielbranch. Push: gegen den Stand davor.
          # Beim ersten Push ist das der Null-SHA — der Check überspringt dann.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          LOCKFILE: pnpm-lock.yaml
          # Im Push-Lauf bestätigt die GitHub-API einen Bot-Autor: der Commit
          # gehört zu einem gemergten PR eines Bots. Braucht `pull-requests: read`.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Tamper-Check übersprungen: kein Stand vor diesem Push."
            exit 0
          fi
          REF=$(git show "$BASE:$LOCKFILE" 2>/dev/null \
            | grep -oE 'renestandout/quality[^"]*[#/][0-9a-f]{40}' \
            | grep -oE '[0-9a-f]{40}$' | head -n 1 || true)
          if [ -z "$REF" ]; then
            echo "::error::Keine quality-Version in $LOCKFILE der Basis gefunden."
            exit 1
          fi
          git clone --quiet --filter=blob:none https://github.com/renestandout/quality "$RUNNER_TEMP/quality-base"
          git -C "$RUNNER_TEMP/quality-base" checkout --quiet "$REF"
          node "$RUNNER_TEMP/quality-base/bin/quality" tamper --base "$BASE"

      - name: Abhängigkeiten auf bekannte Lücken prüfen
        if: always()
        run: pnpm audit --audit-level=high

      # Die CLI statt gitleaks/gitleaks-action: die Action lädt nach dem Scan
      # ein Artefakt hoch und stirbt dabei mit einem Node-Stacktrace, obwohl
      # gitleaks längst "no leaks found" gemeldet hat. Der Job war trotzdem rot
      # — der eine Zustand, den ein Gate nicht überlebt: es behauptet zu prüfen.
      # Aufgefallen am 17.08.2026 in rankscan/application, seither in allen
      # Standout-Repositories so gelöst.
      #
      # Checksumme, weil ein Werkzeug, das Geheimnisse sucht, nicht selbst
      # ungeprüft aus dem Netz ausgeführt werden sollte. `--redact`, damit ein
      # Fund nicht im Klartext im Log landet.
      - name: Secret Scanning
        if: always()
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
