# Quality-Gate für ein Repo mit PHP-Backend und JS-Frontend (Muster: adboard).
#
# Bewusst kein "reusable workflow": die Logik steckt im Paket, nicht im YAML.
# Dadurch ändert sich diese Datei praktisch nie, und ein Update des Frameworks
# wirkt über `composer update` statt über eine Workflow-Version.
#
# Nach .github/workflows/quality.yml im Projekt kopieren und die Pfade anpassen.

name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Nur Lesen. `pull-requests: write` stand hier für die PR-Kommentare von
    # gitleaks-action — die Action ist raus, das Recht damit auch.
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 ist Pflicht — der Tamper-Check vergleicht gegen den
      # Zielbranch und braucht dessen Vorgeschichte.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          # Muss zur LAUFZEIT passen — also zum Image, nicht zur
          # Entwicklungsmaschine und auch nicht blind zu composer.json: dessen
          # Constraint ist eine Mindestangabe und hinkt gern hinterher. Bei
          # adboard verlangte die composer.lock faktisch 8.4.1, während
          # composer.json noch ^8.3 sagte.
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # COMPOSER_AUTH hebt das GitHub-API-Limit an. Ohne Token gelten 60 Anfragen
      # pro Stunde und IP; Composer laedt dist-Archive ueber die API und meldet
      # den Fehlschlag als "Could not authenticate against github.com" — das
      # sieht nach einem Rechteproblem aus und ist keins, auch oeffentliche
      # Pakete trifft es. Auf einem geteilten self-hosted Runner ist das Limit
      # schnell erreicht, und es faellt erst auf, wenn eine Version NEU geladen
      # werden muss: was im Cache liegt, braucht keinen API-Aufruf. Genau so ist
      # es am 19.08.2026 in allen drei Konsumenten gleichzeitig passiert, beim
      # Sprung auf standout/quality v0.2.0.
      #
      # Job-lokal per env, nicht `composer config --global`: auf einem geteilten
      # Runner-Host wuerde eine globale auth.json andere Repositories treffen.
      - name: Abhängigkeiten (PHP)
        working-directory: ads-cockpit/backend
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Abhängigkeiten (JS)
        working-directory: ads-cockpit/frontend
        run: npm ci

      # Laravel: auch wenn die Tests gegen SQLite im Arbeitsspeicher laufen und
      # keine Datenbank brauchen — ohne APP_KEY wirft das Framework
      # MissingAppKeyException, bevor der erste Test startet.
      - name: Testumgebung vorbereiten
        working-directory: ads-cockpit/backend
        run: |
          cp .env.example .env
          php artisan key:generate
          # Bei Laravel Passport zusätzlich nötig — das Schlüsselpaar unter
          # storage/ liegt lokal längst und fehlt in CI:
          # php artisan passport:keys --no-interaction

      # PHPStans Cache liegt im System-Temp (/tmp/phpstan). Auf ubuntu-latest ist
      # der bei jedem Lauf leer, PHPStan analysiert also immer alles neu: in
      # rankscan/application 86s statt 6s. Wer das zurückholen will, nimmt den
      # Block unten dazu. Auf einem self-hosted Runner ist er überflüssig —
      # dort überlebt /tmp den Lauf.
      #
      # Der Schlüssel wechselt bei jedem Lauf, weil ein Cache-Eintrag
      # unveränderlich ist: restore-keys holt den letzten passenden, PHPStan
      # verwendet ihn inkrementell weiter. Nicht am Quelltext-Hash festmachen —
      # ein Cache aus dem Lauf davor ist gültig und genau das, was gebraucht wird.
      #
      # - name: PHPStan-Cache
      #   uses: actions/cache@v4
      #   with:
      #     path: /tmp/phpstan
      #     key: phpstan-${{ github.run_id }}
      #     restore-keys: phpstan-

      - name: Qualitätsprüfungen
        run: ads-cockpit/backend/vendor/bin/quality full

      # Läuft auch beim Push auf den Standardbranch: `cc --abschliessen` merged
      # lokal und pusht die Basis — ohne diesen Zweig sähe der Check den
      # Normalfall nie. Er blockiert den Push nicht, der ist dann schon
      # passiert; er macht ihn sichtbar und färbt main rot.
      # `always()`, damit ein Lauf in einer Runde alles meldet statt in zweien.
      - name: Tamper-Check
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          # Pull Request: gegen den Zielbranch. Push: gegen den Stand davor.
          # Beim ersten Push ist das der Null-SHA — der Check überspringt dann.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ads-cockpit/backend/vendor/bin/quality tamper --base "$BASE"

      - name: Abhängigkeiten auf bekannte Lücken prüfen (PHP)
        if: always()
        working-directory: ads-cockpit/backend
        run: composer audit

      # Nur high/critical blockiert. Ein Gate, das wegen einer transitiven
      # moderate-Meldung dauerrot ist, wird nach zwei Wochen ignoriert.
      - name: Abhängigkeiten auf bekannte Lücken prüfen (JS)
        if: always()
        working-directory: ads-cockpit/frontend
        run: npm audit --audit-level=high

      # Die CLI statt gitleaks/gitleaks-action: die Action lädt nach dem Scan
      # ein Artefakt hoch und stirbt dabei mit einem Node-Stacktrace, obwohl
      # gitleaks längst "no leaks found" gemeldet hat. Der Job war trotzdem rot
      # — der eine Zustand, den ein Gate nicht überlebt: es behauptet zu prüfen.
      # Aufgefallen am 17.08.2026 in rankscan/application, seither in allen
      # Standout-Repositories so gelöst.
      #
      # Checksumme, weil ein Werkzeug, das Geheimnisse sucht, nicht selbst
      # ungeprüft aus dem Netz ausgeführt werden sollte. `--redact`, damit ein
      # Fund nicht im Klartext im Log landet.
      - name: Secret Scanning
        if: always()
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
