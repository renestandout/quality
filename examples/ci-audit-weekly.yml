# Wöchentliche Bestandsaufnahme.
# Nach .github/workflows/quality-audit.yml im Projekt kopieren.
#
# Das PR-Gate prüft immer nur den Diff und sieht damit nur, was sich ändert.
# Dieser Lauf sieht, was sich NICHT ändert: eine Baseline, die seit Monaten
# gleich gross ist, neue Verwundbarkeiten in unveränderten Abhängigkeiten,
# Suppressions, die sich angesammelt haben.
#
# Er schlägt nie fehl — das ist Absicht. Ein wöchentlicher roter Lauf, den
# niemand beheben kann, wird nach drei Wochen ignoriert.

name: Quality-Audit

on:
  schedule:
    - cron: '0 6 * * 1'   # montags früh
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks prüft die gesamte Historie

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --prefer-dist --no-interaction
        working-directory: ./       # Pfad der PHP-Komponente anpassen

      - run: npm ci
        working-directory: ./       # Pfad der JS-Komponente anpassen

      # Die CLI statt gitleaks/gitleaks-action: die Action lädt nach dem Scan
      # ein Artefakt hoch und stirbt dabei mit einem Node-Stacktrace, obwohl
      # gitleaks längst "no leaks found" gemeldet hat. Der Job war trotzdem rot
      # — der eine Zustand, den ein Gate nicht überlebt: es behauptet zu prüfen.
      # Aufgefallen am 17.08.2026 in rankscan/application, seither in allen
      # Standout-Repositories so gelöst.
      #
      # Checksumme, weil ein Werkzeug, das Geheimnisse sucht, nicht selbst
      # ungeprüft aus dem Netz ausgeführt werden sollte. `--redact`, damit ein
      # Fund nicht im Klartext im Log landet.
      - name: Secret Scanning
        continue-on-error: true   # der Fund gehört in den Bericht, nicht in einen roten Lauf
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - name: Bestandsaufnahme
        run: npx quality audit --out audit.md

      - uses: actions/upload-artifact@v4
        with:
          name: quality-audit
          path: audit.md
          retention-days: 90        # damit sich der Verlauf vergleichen lässt
