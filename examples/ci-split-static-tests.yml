# Quality-Gate für ein Repo, dessen Tests lange laufen (Muster: rankscan/application).
#
# Der Unterschied zu ci-monorepo-php-js.yml: Statik und Tests liegen in zwei
# parallelen Jobs statt in einem. Das lohnt sich, sobald die Suite mehrere
# Minuten braucht — der Runner läuft mit stopOnFail: false, ein einzelner Job
# würde also auch bei einem Formatfehler die ganze Suite abwarten, bevor er rot
# wird, und jeder grüne Lauf dauerte die Summe statt das Maximum.
#
# `--only` teilt die Stufe entsprechend auf. Wer keine lange Suite hat, nimmt
# ci-monorepo-php-js.yml: ein Job ist einfacher.
#
# Nach .github/workflows/quality.yml im Projekt kopieren und Versionen,
# Dienste und Testbefehle anpassen.

name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blockierend. Hängt am Diff: derselbe Stand ergibt dasselbe Ergebnis, heute
  # wie in drei Monaten.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 ist Pflicht — der Tamper-Check vergleicht gegen den
      # Zielbranch und braucht dessen Vorgeschichte.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # COMPOSER_AUTH hebt das GitHub-API-Limit an. Ohne Token gelten 60 Anfragen
      # pro Stunde und IP; Composer laedt dist-Archive ueber die API und meldet
      # den Fehlschlag als "Could not authenticate against github.com" — das
      # sieht nach einem Rechteproblem aus und ist keins, auch oeffentliche
      # Pakete trifft es. Auf einem geteilten self-hosted Runner ist das Limit
      # schnell erreicht, und es faellt erst auf, wenn eine Version NEU geladen
      # werden muss: was im Cache liegt, braucht keinen API-Aufruf. Genau so ist
      # es am 19.08.2026 in allen drei Konsumenten gleichzeitig passiert, beim
      # Sprung auf standout/quality v0.2.0.
      #
      # Job-lokal per env, nicht `composer config --global`: auf einem geteilten
      # Runner-Host wuerde eine globale auth.json andere Repositories treffen.
      - name: Abhängigkeiten
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # PHPStans Cache liegt im System-Temp (/tmp/phpstan). Auf ubuntu-latest ist
      # der bei jedem Lauf leer, PHPStan analysiert also immer alles neu: in
      # rankscan/application 86s statt 6s. Wer das zurückholen will, nimmt den
      # Block unten dazu. Auf einem self-hosted Runner ist er überflüssig —
      # dort überlebt /tmp den Lauf.
      #
      # Der Schlüssel wechselt bei jedem Lauf, weil ein Cache-Eintrag
      # unveränderlich ist: restore-keys holt den letzten passenden, PHPStan
      # verwendet ihn inkrementell weiter. Nicht am Quelltext-Hash festmachen —
      # ein Cache aus dem Lauf davor ist gültig und genau das, was gebraucht wird.
      #
      # - name: PHPStan-Cache
      #   uses: actions/cache@v4
      #   with:
      #     path: /tmp/phpstan
      #     key: phpstan-${{ github.run_id }}
      #     restore-keys: phpstan-

      # Nur der statische Teil. `test` und `build` bleiben dem tests-Job
      # überlassen, `tamper` folgt unten als eigener Schritt.
      - name: Qualitätsprüfungen (statisch)
        run: vendor/bin/quality task --only fmt,lint,types

      # Eigener Schritt, weil nur ein Pull Request einen Zielbranch hat.
      # `always()`, damit ein PR in einer Runde alles erfährt statt in zweien.
      - name: Tamper-Check
        if: always() && github.event_name == 'pull_request'
        run: vendor/bin/quality tamper --base origin/${{ github.base_ref }}

  # Ebenfalls blockierend — und deshalb ebenfalls ein Required Check. Steht er
  # nicht in der Liste, lässt sich mit roten Tests mergen.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U db"
          --health-interval=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # COMPOSER_AUTH hebt das GitHub-API-Limit an. Ohne Token gelten 60 Anfragen
      # pro Stunde und IP; Composer laedt dist-Archive ueber die API und meldet
      # den Fehlschlag als "Could not authenticate against github.com" — das
      # sieht nach einem Rechteproblem aus und ist keins, auch oeffentliche
      # Pakete trifft es. Auf einem geteilten self-hosted Runner ist das Limit
      # schnell erreicht, und es faellt erst auf, wenn eine Version NEU geladen
      # werden muss: was im Cache liegt, braucht keinen API-Aufruf. Genau so ist
      # es am 19.08.2026 in allen drei Konsumenten gleichzeitig passiert, beim
      # Sprung auf standout/quality v0.2.0.
      #
      # Job-lokal per env, nicht `composer config --global`: auf einem geteilten
      # Runner-Host wuerde eine globale auth.json andere Repositories treffen.
      - name: Abhängigkeiten
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Zwei Aufrufe, und die Reihenfolge ist der Grund: eine Stufe führt ihre
      # Schritte immer in der eigenen Reihenfolge aus, und dort steht `build`
      # hinter `test`. Tests brauchen den Build aber oft schon vorher — bei
      # Laravel/Inertia sucht der Vite-Helper ohne public/build/manifest.json
      # einen Dev-Server und läuft je Test in einen mehrsekündigen Timeout.
      # `--only build,test` in einem Aufruf würde genau das falsch herum tun.
      #
      # `full`, nicht `task`: nur `full` kennt den Schritt `build`. --only
      # filtert eine Stufe, es erweitert sie nicht.
      - name: Build
        run: vendor/bin/quality full --only build

      - name: Tests
        run: vendor/bin/quality full --only test

  # Informierend, bewusst KEIN Required Check.
  #
  # Diese Prüfungen hängen an der Zeit, nicht am Diff: ein heute
  # veröffentlichtes CVE oder ein geänderter gitleaks-Regelsatz färbt sie rot,
  # ohne dass jemand eine Zeile angefasst hat.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nur Lesen. `pull-requests: write` stand hier für die PR-Kommentare von
    # gitleaks-action — die Action ist raus, das Recht damit auch.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # COMPOSER_AUTH hebt das GitHub-API-Limit an. Ohne Token gelten 60 Anfragen
      # pro Stunde und IP; Composer laedt dist-Archive ueber die API und meldet
      # den Fehlschlag als "Could not authenticate against github.com" — das
      # sieht nach einem Rechteproblem aus und ist keins, auch oeffentliche
      # Pakete trifft es. Auf einem geteilten self-hosted Runner ist das Limit
      # schnell erreicht, und es faellt erst auf, wenn eine Version NEU geladen
      # werden muss: was im Cache liegt, braucht keinen API-Aufruf. Genau so ist
      # es am 19.08.2026 in allen drei Konsumenten gleichzeitig passiert, beim
      # Sprung auf standout/quality v0.2.0.
      #
      # Job-lokal per env, nicht `composer config --global`: auf einem geteilten
      # Runner-Host wuerde eine globale auth.json andere Repositories treffen.
      - name: Abhängigkeiten
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Abhängigkeiten auf bekannte Lücken prüfen (PHP)
        if: always()
        run: composer audit

      - name: Abhängigkeiten auf bekannte Lücken prüfen (JS)
        if: always()
        run: npm audit --audit-level=high

      # Die CLI statt gitleaks/gitleaks-action: die Action lädt nach dem Scan
      # ein Artefakt hoch und stirbt dabei mit einem Node-Stacktrace, obwohl
      # gitleaks längst "no leaks found" gemeldet hat. Der Job war trotzdem rot
      # — der eine Zustand, den ein Gate nicht überlebt: es behauptet zu prüfen.
      # Aufgefallen am 17.08.2026 in rankscan/application, seither in allen
      # Standout-Repositories so gelöst.
      #
      # Checksumme, weil ein Werkzeug, das Geheimnisse sucht, nicht selbst
      # ungeprüft aus dem Netz ausgeführt werden sollte. `--redact`, damit ein
      # Fund nicht im Klartext im Log landet.
      - name: Secret Scanning
        if: always()
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
