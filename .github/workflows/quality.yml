# Das Framework prüft sich mit seinen eigenen Werkzeugen.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualitätsprüfungen
        run: node bin/quality full

      - name: Tamper-Check
        if: always() && github.event_name == 'pull_request'
        run: node bin/quality tamper --base origin/${{ github.base_ref }}
